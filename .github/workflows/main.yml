```
steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Preparar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Instalar Pillow
    run: |
      python -m pip install --upgrade pip
      pip install Pillow

  - name: Generar iconos Darsalud
    run: |
      python - <<'PY'
      from PIL import Image

      logo = Image.open("Logo Oficial Darsalud Droguerías.png").convert("RGBA")

      def crear_icono(tamano, salida):
          fondo = Image.new("RGBA", (tamano, tamano), "#020b2d")

          logo_copia = logo.copy()
          logo_copia.thumbnail(
              (int(tamano * 0.88), int(tamano * 0.88)),
              Image.Resampling.LANCZOS
          )

          x = (tamano - logo_copia.width) // 2
          y = (tamano - logo_copia.height) // 2

          fondo.alpha_composite(logo_copia, (x, y))
          fondo.convert("RGB").save(salida, "PNG", optimize=True)

      crear_icono(192, "icons/icon-192.png")
      crear_icono(512, "icons/icon-512.png")
      PY

  - name: Guardar iconos en GitHub
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add icons/icon-192.png icons/icon-512.png
      git commit -m "Generar iconos PWA Darsalud" || echo "No hay cambios para guardar"
      git push
