```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>APP Darsalud - Dashboard Gerencial</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #0057a8 0%,
          #0074c8 50%,
          #003f7d 100%
        );

      padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    /* TARJETA */

    .login-card {
      background: #ffffff;

      border-radius: 22px;

      padding: 42px 38px 35px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);

      text-align: center;
    }

    /* LOGO TEXTUAL */

    .logo {
      margin-bottom: 25px;
    }

    .logo-main {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0057a8;
    }

    .logo-sub {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #d71920;
      margin-top: 4px;
    }

    /* TITULO */

    h1 {
      color: #1d1d1d;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 15px;
      margin-bottom: 30px;
    }

    /* CAMPOS */

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #444;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }

    input {
      width: 100%;

      padding: 14px 14px 14px 45px;

      border: 1px solid #d5d5d5;
      border-radius: 10px;

      font-size: 16px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #0074c8;

      box-shadow:
        0 0 0 3px rgba(0, 116, 200, 0.12);
    }

    /* BOTÓN */

    button {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: 10px;

      background: #d71920;

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

      margin-top: 5px;
    }

    button:hover {
      background: #b9151b;

      transform: translateY(-1px);

      box-shadow:
        0 5px 15px rgba(215, 25, 32, 0.25);
    }

    /* ERROR */

    .error {
      display: none;

      margin-top: 16px;

      padding: 10px;

      border-radius: 8px;

      background: #fff0f0;

      color: #c40000;

      font-size: 14px;
      font-weight: bold;
    }

    /* PIE */

    .footer {
      margin-top: 28px;

      color: #888;

      font-size: 12px;

      line-height: 1.5;
    }

    .footer strong {
      color: #0057a8;
    }

    /* CELULARES */

    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .login-card {
        padding: 35px 25px 30px;
        border-radius: 18px;
      }

      .logo-main {
        font-size: 29px;
      }

      h1 {
        font-size: 22px;
      }

    }

  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <!-- LOGO PROVISIONAL -->

      <div class="logo">

        <div class="logo-main">
          DARSALUD
        </div>

        <div class="logo-sub">
          DROGUERÍAS
        </div>

      </div>


      <!-- TITULO -->

      <h1>
        APP Darsalud
      </h1>

      <div class="subtitle">
        Dashboard Gerencial
      </div>


      <!-- USUARIO -->

      <div class="input-group">

        <label for="usuario">
          Usuario
        </label>

        <div class="input-wrapper">

          <span class="input-icon">
            👤
          </span>

          <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
          >

        </div>

      </div>


      <!-- CONTRASEÑA -->

      <div class="input-group">

        <label for="password">
          Contraseña
        </label>

        <div class="input-wrapper">

          <span class="input-icon">
            🔐
          </span>

          <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          >

        </div>

      </div>


      <!-- BOTÓN -->

      <button onclick="ingresar()">
        INGRESAR AL DASHBOARD
      </button>


      <!-- MENSAJE DE ERROR -->

      <div id="error" class="error">
        Usuario o contraseña incorrectos
      </div>


      <!-- PIE -->

      <div class="footer">

        <strong>Darsalud Droguerías</strong><br>

        Más cerca de usted

      </div>

    </div>

  </div>


  <script>

    function ingresar() {

      const usuario =
        document.getElementById("usuario").value.trim();

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      /*
        ACCESO TEMPORAL PARA PRUEBAS

        Usuario:
        gerente

        Contraseña:
        Darsalud2026
      */

      if (
        usuario === "gerente" &&
        password === "Darsalud2026"
      ) {

        window.location.href =
          "Dashboard_Darsalud_Comparativo.html";

      } else {

        error.style.display = "block";

      }

    }


    /* Permitir ENTER para ingresar */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          ingresar();

        }

      }
    );

  </script>

</body>
</html>
```
