<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<meta
name="theme-color"
content="#0066ff"

>

  <title>Darsalud Droguerías | Dashboard Gerencial</title>

  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      overflow-x: hidden;

      background:
        #ffffff;

      position: relative;

    }


    /* =====================================================
       FONDO FUTURISTA AZUL
       ===================================================== */

    body::before {

      content: "";

      position: fixed;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,126,255,0.16) 0%,
          rgba(0,126,255,0.06) 35%,
          transparent 70%
        );

      top: -250px;
      left: -220px;

      pointer-events: none;

    }


    body::after {

      content: "";

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,183,255,0.14) 0%,
          rgba(0,183,255,0.05) 40%,
          transparent 70%
        );

      bottom: -250px;
      right: -220px;

      pointer-events: none;

    }


    /* =====================================================
       LÍNEAS TECNOLÓGICAS
       ===================================================== */

    .tech-lines {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.35;

      background-image:

        linear-gradient(
          rgba(0,102,255,0.035) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(0,102,255,0.035) 1px,
          transparent 1px
        );

      background-size:
        55px 55px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 20%,
          black 80%,
          transparent
        );

    }


    /* =====================================================
       DECORACIÓN FUTURISTA
       ===================================================== */

    .tech-circle {

      position: fixed;

      width: 700px;
      height: 700px;

      border:
        1px solid
        rgba(0,119,255,0.07);

      border-radius: 50%;

      pointer-events: none;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

    }


    .tech-circle::before {

      content: "";

      position: absolute;

      inset: 45px;

      border:
        1px solid
        rgba(0,119,255,0.05);

      border-radius: 50%;

    }


    /* =====================================================
       CONTENEDOR
       ===================================================== */

    .login-container {

      width: 100%;

      max-width: 460px;

      position: relative;

      z-index: 5;

    }


    /* =====================================================
       TARJETA PRINCIPAL
       ===================================================== */

    .login-card {

      width: 100%;

      padding:
        42px
        42px
        30px;

      border-radius: 24px;

      background:
        rgba(255,255,255,0.96);

      border:
        1px solid
        rgba(0,102,255,0.15);

      box-shadow:

        0 25px 70px
        rgba(0,65,150,0.14),

        0 0 0 1px
        rgba(0,126,255,0.04),

        inset 0 1px 0
        rgba(255,255,255,1);

      text-align: center;

      position: relative;

      overflow: hidden;

      animation:
        cardEntrance
        0.8s
        ease
        forwards;

    }


    @keyframes cardEntrance {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(0.97);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =====================================================
       BARRA SUPERIOR FUTURISTA
       ===================================================== */

    .login-card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      height: 4px;

      background:

        linear-gradient(
          90deg,
          #0057ff,
          #00aaff,
          #006eff,
          #00c8ff,
          #0057ff
        );

      box-shadow:

        0 0 12px
        rgba(0,119,255,0.55),

        0 0 30px
        rgba(0,160,255,0.25);

    }


    /* =====================================================
       DETALLE LATERAL
       ===================================================== */

    .login-card::after {

      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      border:
        1px solid
        rgba(0,119,255,0.06);

      top: -90px;
      right: -90px;

      pointer-events: none;

    }


    /* =====================================================
       LOGO
       ===================================================== */

    .logo-area {

      margin-bottom: 25px;

      position: relative;

      padding:
        8px
        0
        4px;

    }


    .logo-glow {

      position: absolute;

      width: 260px;
      height: 90px;

      left: 50%;
      top: 10px;

      transform:
        translateX(-50%);

      background:
        rgba(0,126,255,0.10);

      filter:
        blur(38px);

      pointer-events: none;

    }


    .logo {

      position: relative;

      width: 88%;

      max-width: 340px;

      height: auto;

      display: block;

      margin: 0 auto;

      filter:

        drop-shadow(
          0 3px 8px
          rgba(0,80,180,0.14)
        );

    }


    /* =====================================================
       SEPARADOR
       ===================================================== */

    .separator {

      width: 85%;

      height: 1px;

      margin:
        0 auto
        25px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(0,119,255,0.35),
          rgba(0,180,255,0.65),
          rgba(0,119,255,0.35),
          transparent
        );

    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    .welcome-label {

      color:
        #006cff;

      font-size:
        11px;

      font-weight:
        800;

      letter-spacing:
        3px;

      text-transform:
        uppercase;

      margin-bottom:
        8px;

    }


    h1 {

      color:
        #09213f;

      font-size:
        27px;

      font-weight:
        800;

      margin-bottom:
        7px;

      letter-spacing:
        0.2px;

    }


    .subtitle {

      color:
        #607086;

      font-size:
        14px;

      margin-bottom:
        28px;

    }


    /* =====================================================
       CAMPOS
       ===================================================== */

    .input-group {

      text-align:
        left;

      margin-bottom:
        18px;

    }


    .input-group label {

      display:
        block;

      color:
        #25415f;

      font-size:
        12px;

      font-weight:
        800;

      letter-spacing:
        0.7px;

      margin-bottom:
        8px;

      text-transform:
        uppercase;

    }


    .input-wrapper {

      position:
        relative;

    }


    .input-icon {

      position:
        absolute;

      left:
        16px;

      top:
        50%;

      transform:
        translateY(-50%);

      color:
        #0075ff;

      font-size:
        17px;

      z-index:
        2;

    }


    input {

      width:
        100%;

      height:
        52px;

      padding:
        0 48px;

      border:
        1px solid
        rgba(0,102,255,0.20);

      border-radius:
        12px;

      background:
        #f2f7ff;

      color:
        #102d4d;

      font-size:
        15px;

      outline:
        none;

      transition:
        all 0.25s ease;

      box-shadow:
        inset 0 1px 3px
        rgba(0,50,120,0.06);

    }


    input::placeholder {

      color:
        #8a9bb0;

    }


    input:focus {

      border-color:
        #007cff;

      background:
        #ffffff;

      box-shadow:

        0 0 0 3px
        rgba(0,126,255,0.10),

        0 0 20px
        rgba(0,126,255,0.12);

    }


    /* =====================================================
       BOTÓN MOSTRAR CONTRASEÑA
       ===================================================== */

    .password-toggle {

      position:
        absolute;

      right:
        14px;

      top:
        50%;

      transform:
        translateY(-50%);

      border:
        none;

      background:
        transparent;

      color:
        #7690aa;

      cursor:
        pointer;

      font-size:
        16px;

      width:
        auto;

      padding:
        4px;

      margin:
        0;

      box-shadow:
        none;

    }


    .password-toggle:hover {

      color:
        #007cff;

      background:
        transparent;

      transform:
        translateY(-50%);

      box-shadow:
        none;

    }


    /* =====================================================
       BOTÓN INGRESAR
       ===================================================== */

    .login-button {

      width:
        100%;

      height:
        54px;

      margin-top:
        7px;

      border:
        none;

      border-radius:
        12px;

      background:

        linear-gradient(
          135deg,
          #0057ff,
          #008cff,
          #00a8ff
        );

      color:
        #ffffff;

      font-size:
        14px;

      font-weight:
        800;

      letter-spacing:
        1px;

      cursor:
        pointer;

      transition:
        all 0.25s ease;

      box-shadow:

        0 8px 25px
        rgba(0,103,255,0.28),

        0 0 20px
        rgba(0,160,255,0.10);

      position:
        relative;

      overflow:
        hidden;

    }


    .login-button::before {

      content:
        "";

      position:
        absolute;

      top:
        0;

      left:
        -100%;

      width:
        60%;

      height:
        100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.40),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left 0.6s ease;

    }


    .login-button:hover::before {

      left:
        140%;

    }


    .login-button:hover {

      transform:
        translateY(-2px);

      box-shadow:

        0 12px 32px
        rgba(0,105,255,0.35),

        0 0 25px
        rgba(0,170,255,0.18);

    }


    .login-button:active {

      transform:
        translateY(0);

    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error {

      display:
        none;

      margin-top:
        15px;

      padding:
        11px 12px;

      border-radius:
        9px;

      background:
        rgba(255,45,45,0.07);

      border:
        1px solid
        rgba(255,70,70,0.22);

      color:
        #d93030;

      font-size:
        13px;

      font-weight:
        700;

      animation:
        errorShake
        0.3s
        ease;

    }


    @keyframes errorShake {

      0%,
      100% {
        transform:
          translateX(0);
      }

      25% {
        transform:
          translateX(-5px);
      }

      75% {
        transform:
          translateX(5px);
      }

    }


    /* =====================================================
       PIE
       ===================================================== */

    .footer {

      margin-top:
        26px;

      padding-top:
        17px;

      border-top:
        1px solid
        rgba(0,102,255,0.10);

      font-size:
        11px;

      line-height:
        1.7;

      color:
        #7a8ca0;

    }


    .footer strong {

      color:
        #006eff;

      letter-spacing:
        1.2px;

    }


    .security {

      margin-top:
        5px;

      font-size:
        10px;

      color:
        #a0adba;

    }


    /* =====================================================
       CELULARES
       ===================================================== */

    @media (max-width: 480px) {

      body {

        padding:
          15px;

      }


      .login-card {

        padding:
          34px
          24px
          24px;

        border-radius:
          21px;

      }


      .logo {

        width:
          94%;

      }


      h1 {

        font-size:
          23px;

      }


      .subtitle {

        font-size:
          13px;

      }


      input {

        height:
          50px;

      }


      .login-button {

        height:
          52px;

      }


      .tech-circle {

        width:
          500px;

        height:
          500px;

      }

    }


    /* =====================================================
       CELULARES MUY PEQUEÑOS
       ===================================================== */

    @media (max-height: 700px) {

      .login-card {

        padding-top:
          25px;

        padding-bottom:
          20px;

      }


      .logo-area {

        margin-bottom:
          17px;

      }


      .logo {

        max-width:
          280px;

      }


      .subtitle {

        margin-bottom:
          20px;

      }


      .footer {

        margin-top:
          17px;

      }

    }

  </style>

</head>

<body>

  <!-- FONDO TECNOLÓGICO -->

  <div class="tech-lines"></div>

  <div class="tech-circle"></div>

  <div class="login-container">

```
<div class="login-card">


  <!-- =================================================
       LOGO OFICIAL
       ================================================= -->

  <div class="logo-area">

    <div class="logo-glow"></div>

    <img
      src="Logo Darsalud Droguerías .jpg"
      alt="Darsalud Droguerías"
      class="logo"
    >

  </div>


  <div class="separator"></div>


  <!-- =================================================
       ENCABEZADO
       ================================================= -->

  <div class="welcome-label">
    ACCESO SEGURO
  </div>


  <h1>
    Dashboard Gerencial
  </h1>


  <div class="subtitle">
    Plataforma de gestión y análisis empresarial
  </div>


  <!-- =================================================
       USUARIO
       ================================================= -->

  <div class="input-group">

    <label for="usuario">
      Usuario
    </label>


    <div class="input-wrapper">

      <span class="input-icon">
        ◉
      </span>


      <input
        type="text"
        id="usuario"
        placeholder="Ingrese su usuario"
        autocomplete="username"
      >

    </div>

  </div>


  <!-- =================================================
       CONTRASEÑA
       ================================================= -->

  <div class="input-group">

    <label for="password">
      Contraseña
    </label>


    <div class="input-wrapper">

      <span class="input-icon">
        ◆
      </span>


      <input
        type="password"
        id="password"
        placeholder="Ingrese su contraseña"
        autocomplete="current-password"
      >


      <button
        type="button"
        class="password-toggle"
        onclick="mostrarPassword()"
        id="togglePassword"
        aria-label="Mostrar contraseña"
      >
        ◉
      </button>

    </div>

  </div>


  <!-- =================================================
       BOTÓN
       ================================================= -->

  <button
    type="button"
    class="login-button"
    onclick="ingresar()"
  >

    INGRESAR AL DASHBOARD

  </button>


  <!-- =================================================
       ERROR
       ================================================= -->

  <div
    id="error"
    class="error"
  >

    ⚠ Usuario o contraseña incorrectos

  </div>


  <!-- =================================================
       PIE
       ================================================= -->

  <div class="footer">

    <strong>
      DARSALUD DROGUERÍAS
    </strong>

    <br>

    Más cerca de usted

    <div class="security">
      Plataforma gerencial · Acceso autorizado
    </div>

  </div>


</div>
```

  </div>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       INGRESO
       ===================================================== */

    function ingresar() {


      const usuario =
        document
          .getElementById("usuario")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const error =
        document
          .getElementById("error");


      /*
        ACCESO TEMPORAL PARA PRUEBAS

        Usuario:
        gerente

        Contraseña:
        Darsalud2026
      */


      if (
        usuario === "gerente" &&
        password === "Darsalud2026"
      ) {


        error.style.display =
          "none";


        window.location.href =
          "Dashboard_Darsalud_Comparativo.html";


      } else {


        error.style.display =
          "block";


        document
          .getElementById("password")
          .focus();


      }

    }


    /* =====================================================
       MOSTRAR / OCULTAR CONTRASEÑA
       ===================================================== */

    function mostrarPassword() {


      const password =
        document
          .getElementById("password");


      const toggle =
        document
          .getElementById("togglePassword");


      if (
        password.type === "password"
      ) {


        password.type =
          "text";


        toggle.textContent =
          "○";


      } else {


        password.type =
          "password";


        toggle.textContent =
          "◉";

      }

    }


    /* =====================================================
       ENTER PARA INGRESAR
       ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {


        if (
          event.key === "Enter"
        ) {


          ingresar();

        }

      }
    );


  </script>

</body>
