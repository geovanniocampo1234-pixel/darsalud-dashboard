<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#061426"
  >

  <title>Darsalud Droguerías | Dashboard Gerencial</title>


  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      overflow-x: hidden;

      background:

        radial-gradient(
          circle at 20% 20%,
          rgba(0, 126, 255, 0.20),
          transparent 35%
        ),

        radial-gradient(
          circle at 80% 80%,
          rgba(0, 183, 255, 0.15),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #020b16 0%,
          #061426 45%,
          #03101f 100%
        );

      position: relative;

    }


    /* =====================================================
       EFECTOS DE FONDO
       ===================================================== */

    body::before {

      content: "";

      position: fixed;

      width: 450px;
      height: 450px;

      border-radius: 50%;

      background:
        rgba(0, 122, 255, 0.08);

      filter: blur(80px);

      top: -180px;
      left: -180px;

      pointer-events: none;

    }


    body::after {

      content: "";

      position: fixed;

      width: 400px;
      height: 400px;

      border-radius: 50%;

      background:
        rgba(0, 183, 255, 0.06);

      filter: blur(80px);

      bottom: -180px;
      right: -150px;

      pointer-events: none;

    }


    /* =====================================================
       LÍNEAS TECNOLÓGICAS
       ===================================================== */

    .tech-lines {

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.18;

      background-image:

        linear-gradient(
          rgba(0, 140, 255, 0.08) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(0, 140, 255, 0.08) 1px,
          transparent 1px
        );

      background-size:
        55px 55px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 25%,
          black 75%,
          transparent
        );

    }


    /* =====================================================
       CONTENEDOR
       ===================================================== */

    .login-container {

      width: 100%;

      max-width: 460px;

      position: relative;

      z-index: 5;

    }


    /* =====================================================
       TARJETA PRINCIPAL
       ===================================================== */

    .login-card {

      width: 100%;

      padding:
        45px
        42px
        32px;

      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.035)
        );

      border:
        1px solid
        rgba(255,255,255,0.15);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:

        0 30px 80px
        rgba(0,0,0,0.55),

        inset 0 1px 0
        rgba(255,255,255,0.08);

      text-align: center;

      position: relative;

      overflow: hidden;

      animation:
        cardEntrance
        0.8s
        ease
        forwards;

    }


    @keyframes cardEntrance {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(0.97);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* Línea superior luminosa */

    .login-card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 12%;

      width: 76%;

      height: 2px;

      background:

        linear-gradient(
          90deg,
          transparent,
          #008cff,
          #36c5ff,
          #008cff,
          transparent
        );

      box-shadow:

        0 0 12px
        rgba(0,150,255,0.8),

        0 0 30px
        rgba(0,150,255,0.45);

    }


    /* =====================================================
       LOGO
       ===================================================== */

    .logo-area {

      margin-bottom: 28px;

      position: relative;

    }


    .logo-glow {

      position: absolute;

      width: 220px;
      height: 90px;

      left: 50%;
      top: 5px;

      transform:
        translateX(-50%);

      background:
        rgba(0, 140, 255, 0.12);

      filter:
        blur(35px);

      pointer-events: none;

    }


    .logo {

      position: relative;

      width: 88%;

      max-width: 340px;

      height: auto;

      display: block;

      margin: 0 auto;

      filter:

        drop-shadow(
          0 0 10px
          rgba(0,132,255,0.28)
        );

    }


    /* =====================================================
       SEPARADOR
       ===================================================== */

    .separator {

      width: 100%;

      height: 1px;

      margin:
        0 auto
        26px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(0,151,255,0.55),
          transparent
        );

    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    .welcome-label {

      color:
        #5ccaff;

      font-size:
        11px;

      font-weight:
        800;

      letter-spacing:
        3px;

      text-transform:
        uppercase;

      margin-bottom:
        8px;

    }


    h1 {

      color:
        #ffffff;

      font-size:
        27px;

      font-weight:
        700;

      margin-bottom:
        7px;

      letter-spacing:
        0.3px;

    }


    .subtitle {

      color:
        rgba(255,255,255,0.60);

      font-size:
        14px;

      margin-bottom:
        30px;

    }


    /* =====================================================
       CAMPOS
       ===================================================== */

    .input-group {

      text-align:
        left;

      margin-bottom:
        18px;

    }


    .input-group label {

      display:
        block;

      color:
        rgba(255,255,255,0.80);

      font-size:
        12px;

      font-weight:
        700;

      letter-spacing:
        0.6px;

      margin-bottom:
        8px;

      text-transform:
        uppercase;

    }


    .input-wrapper {

      position:
        relative;

    }


    .input-icon {

      position:
        absolute;

      left:
        16px;

      top:
        50%;

      transform:
        translateY(-50%);

      color:
        #55c9ff;

      font-size:
        17px;

      z-index:
        2;

    }


    input {

      width:
        100%;

      height:
        52px;

      padding:
        0 48px;

      border:
        1px solid
        rgba(255,255,255,0.12);

      border-radius:
        12px;

      background:
        rgba(2,15,30,0.72);

      color:
        #ffffff;

      font-size:
        15px;

      outline:
        none;

      transition:
        all 0.25s ease;

      box-shadow:
        inset 0 1px 2px
        rgba(0,0,0,0.25);

    }


    input::placeholder {

      color:
        rgba(255,255,255,0.35);

    }


    input:focus {

      border-color:
        #009cff;

      background:
        rgba(3,22,42,0.90);

      box-shadow:

        0 0 0 3px
        rgba(0,156,255,0.10),

        0 0 18px
        rgba(0,156,255,0.15);

    }


    /* =====================================================
       BOTÓN MOSTRAR CONTRASEÑA
       ===================================================== */

    .password-toggle {

      position:
        absolute;

      right:
        14px;

      top:
        50%;

      transform:
        translateY(-50%);

      border:
        none;

      background:
        transparent;

      color:
        rgba(255,255,255,0.45);

      cursor:
        pointer;

      font-size:
        16px;

      width:
        auto;

      padding:
        4px;

      margin:
        0;

      box-shadow:
        none;

    }


    .password-toggle:hover {

      color:
        #59caff;

      background:
        transparent;

      transform:
        translateY(-50%);

      box-shadow:
        none;

    }


    /* =====================================================
       BOTÓN INGRESAR
       ===================================================== */

    .login-button {

      width:
        100%;

      height:
        54px;

      margin-top:
        7px;

      border:
        none;

      border-radius:
        12px;

      background:

        linear-gradient(
          135deg,
          #006eff,
          #009cff
        );

      color:
        #ffffff;

      font-size:
        14px;

      font-weight:
        800;

      letter-spacing:
        1px;

      cursor:
        pointer;

      transition:
        all 0.25s ease;

      box-shadow:

        0 8px 25px
        rgba(0,119,255,0.30);

      position:
        relative;

      overflow:
        hidden;

    }


    .login-button::before {

      content:
        "";

      position:
        absolute;

      top:
        0;

      left:
        -100%;

      width:
        60%;

      height:
        100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.25),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left 0.6s ease;

    }


    .login-button:hover::before {

      left:
        140%;

    }


    .login-button:hover {

      transform:
        translateY(-2px);

      box-shadow:

        0 12px 32px
        rgba(0,140,255,0.40);

    }


    .login-button:active {

      transform:
        translateY(0);

    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error {

      display:
        none;

      margin-top:
        15px;

      padding:
        11px 12px;

      border-radius:
        9px;

      background:
        rgba(255,45,45,0.10);

      border:
        1px solid
        rgba(255,70,70,0.25);

      color:
        #ff8585;

      font-size:
        13px;

      font-weight:
        700;

      animation:
        errorShake
        0.3s
        ease;

    }


    @keyframes errorShake {

      0%,
      100% {
        transform:
          translateX(0);
      }

      25% {
        transform:
          translateX(-5px);
      }

      75% {
        transform:
          translateX(5px);
      }

    }


    /* =====================================================
       PIE
       ===================================================== */

    .footer {

      margin-top:
        28px;

      padding-top:
        18px;

      border-top:
        1px solid
        rgba(255,255,255,0.07);

      font-size:
        11px;

      line-height:
        1.7;

      color:
        rgba(255,255,255,0.38);

    }


    .footer strong {

      color:
        #54c7ff;

      letter-spacing:
        1.2px;

    }


    .security {

      margin-top:
        5px;

      font-size:
        10px;

      color:
        rgba(255,255,255,0.25);

    }


    /* =====================================================
       CELULARES
       ===================================================== */

    @media (max-width: 480px) {

      body {

        padding:
          15px;

      }


      .login-card {

        padding:
          35px
          24px
          25px;

        border-radius:
          22px;

      }


      .logo {

        width:
          94%;

      }


      h1 {

        font-size:
          23px;

      }


      .subtitle {

        font-size:
          13px;

      }


      input {

        height:
          50px;

      }


      .login-button {

        height:
          52px;

      }

    }


    /* =====================================================
       CELULARES MUY PEQUEÑOS
       ===================================================== */

    @media (max-height: 700px) {

      .login-card {

        padding-top:
          25px;

        padding-bottom:
          22px;

      }


      .logo-area {

        margin-bottom:
          18px;

      }


      .logo {

        max-width:
          280px;

      }


      .subtitle {

        margin-bottom:
          20px;

      }


      .footer {

        margin-top:
          18px;

      }

    }

  </style>

</head>


<body>


  <!-- FONDO TECNOLÓGICO -->

  <div class="tech-lines"></div>


  <div class="login-container">


    <div class="login-card">


      <!-- =================================================
           LOGO OFICIAL
           ================================================= -->

      <div class="logo-area">

        <div class="logo-glow"></div>

        <img
          src="logo-darsalud-transparente.png"
          alt="Darsalud Droguerías"
          class="logo"
        >

      </div>


      <div class="separator"></div>


      <!-- =================================================
           ENCABEZADO
           ================================================= -->

      <div class="welcome-label">
        ACCESO SEGURO
      </div>


      <h1>
        Dashboard Gerencial
      </h1>


      <div class="subtitle">
        Plataforma de gestión y análisis empresarial
      </div>


      <!-- =================================================
           USUARIO
           ================================================= -->

      <div class="input-group">

        <label for="usuario">
          Usuario
        </label>


        <div class="input-wrapper">

          <span class="input-icon">
            ◉
          </span>


          <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
          >

        </div>

      </div>


      <!-- =================================================
           CONTRASEÑA
           ================================================= -->

      <div class="input-group">

        <label for="password">
          Contraseña
        </label>


        <div class="input-wrapper">

          <span class="input-icon">
            ◆
          </span>


          <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          >


          <button
            type="button"
            class="password-toggle"
            onclick="mostrarPassword()"
            id="togglePassword"
            aria-label="Mostrar contraseña"
          >
            ◉
          </button>

        </div>

      </div>


      <!-- =================================================
           BOTÓN
           ================================================= -->

      <button
        type="button"
        class="login-button"
        onclick="ingresar()"
      >

        INGRESAR AL DASHBOARD

      </button>


      <!-- =================================================
           ERROR
           ================================================= -->

      <div
        id="error"
        class="error"
      >

        ⚠ Usuario o contraseña incorrectos

      </div>


      <!-- =================================================
           PIE
           ================================================= -->

      <div class="footer">

        <strong>
          DARSALUD DROGUERÍAS
        </strong>

        <br>

        Más cerca de usted

        <div class="security">
          Plataforma gerencial · Acceso autorizado
        </div>

      </div>


    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       INGRESO
       ===================================================== */

    function ingresar() {


      const usuario =
        document
          .getElementById("usuario")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const error =
        document
          .getElementById("error");


      /*
        ACCESO TEMPORAL PARA PRUEBAS

        Usuario:
        gerente

        Contraseña:
        Darsalud2026
      */


      if (
        usuario === "gerente" &&
        password === "Darsalud2026"
      ) {


        error.style.display =
          "none";


        window.location.href =
          "Dashboard_Darsalud_Comparativo.html";


      } else {


        error.style.display =
          "block";


        document
          .getElementById("password")
          .focus();


      }

    }


    /* =====================================================
       MOSTRAR / OCULTAR CONTRASEÑA
       ===================================================== */

    function mostrarPassword() {


      const password =
        document
          .getElementById("password");


      const toggle =
        document
          .getElementById("togglePassword");


      if (
        password.type === "password"
      ) {


        password.type =
          "text";


        toggle.textContent =
          "○";


      } else {


        password.type =
          "password";


        toggle.textContent =
          "◉";

      }

    }


    /* =====================================================
       ENTER PARA INGRESAR
       ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {


        if (
          event.key === "Enter"
        ) {


          ingresar();

        }

      }
    );


  </script>


</body>

</html>
