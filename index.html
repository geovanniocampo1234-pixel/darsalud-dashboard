<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020b2d">

    <title>Darsalud Droguerías | Dashboard Gerencial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(0, 153, 255, 0.30) 0%,
                    rgba(0, 60, 180, 0.16) 25%,
                    transparent 55%
                ),
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 225, 255, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(0, 90, 255, 0.18),
                    transparent 35%
                ),
                #010722;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            color: white;
        }

        /* ================================
           FONDO DIGITAL
        ================================= */

        .background-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(0, 174, 255, 0.07) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 174, 255, 0.07) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image: radial-gradient(
                circle at center,
                black 20%,
                transparent 80%
            );

            animation: gridMove 18s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(55px, 55px);
            }
        }

        /* ================================
           AURAS NEÓN
        ================================= */

        .neon-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.55;
        }

        .orb-one {
            width: 350px;
            height: 350px;
            background: #0077ff;
            top: -130px;
            left: -100px;
            animation: orbOne 8s ease-in-out infinite alternate;
        }

        .orb-two {
            width: 420px;
            height: 420px;
            background: #00c8ff;
            right: -160px;
            bottom: -160px;
            animation: orbTwo 10s ease-in-out infinite alternate;
        }

        @keyframes orbOne {
            from {
                transform: translate(0, 0) scale(0.9);
            }

            to {
                transform: translate(80px, 80px) scale(1.1);
            }
        }

        @keyframes orbTwo {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-70px, -70px) scale(0.85);
            }
        }

        /* ================================
           LÍNEAS DE ENERGÍA
        ================================= */

        .energy {
            position: fixed;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #00d9ff,
                #008cff,
                transparent
            );

            box-shadow:
                0 0 8px #00bfff,
                0 0 22px rgba(0, 174, 255, 0.7);

            opacity: 0.6;
            pointer-events: none;
        }

        .energy-one {
            width: 45%;
            top: 18%;
            left: -5%;
            transform: rotate(-8deg);
            animation: energyOne 5s linear infinite;
        }

        .energy-two {
            width: 40%;
            bottom: 17%;
            right: -5%;
            transform: rotate(-8deg);
            animation: energyTwo 6s linear infinite;
        }

        @keyframes energyOne {
            from {
                transform: translateX(-20%) rotate(-8deg);
            }

            to {
                transform: translateX(130%) rotate(-8deg);
            }
        }

        @keyframes energyTwo {
            from {
                transform: translateX(20%) rotate(-8deg);
            }

            to {
                transform: translateX(-130%) rotate(-8deg);
            }
        }

        /* ================================
           CONTENEDOR
        ================================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            position: relative;
            z-index: 2;
        }

        /* ================================
           TARJETA PRINCIPAL
        ================================= */

        .login-card {
            width: 100%;
            max-width: 475px;

            position: relative;

            padding: 42px 42px 32px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(8, 25, 70, 0.94),
                    rgba(2, 12, 40, 0.92)
                );

            border: 1px solid rgba(0, 190, 255, 0.45);

            box-shadow:
                0 0 0 1px rgba(0, 110, 255, 0.08),
                0 0 30px rgba(0, 136, 255, 0.25),
                0 0 80px rgba(0, 110, 255, 0.18),
                0 35px 90px rgba(0, 0, 20, 0.65);

            backdrop-filter: blur(25px);

            overflow: hidden;

            animation: cardAppear 1s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Línea superior */

        .top-energy {
            position: absolute;
            top: 0;
            left: 8%;
            width: 84%;
            height: 3px;

            background: linear-gradient(
                90deg,
                transparent,
                #00c8ff,
                #ffffff,
                #00c8ff,
                transparent
            );

            box-shadow:
                0 0 8px #00bfff,
                0 0 25px #007bff,
                0 0 45px rgba(0, 174, 255, 0.8);

            animation: topEnergy 3s ease-in-out infinite;
        }

        @keyframes topEnergy {
            0%,
            100% {
                opacity: 0.5;
                transform: scaleX(0.75);
            }

            50% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* ================================
           ESQUINAS TECNOLÓGICAS
        ================================= */

        .corner {
            position: absolute;
            width: 22px;
            height: 22px;

            border-color: #00bfff;
            border-style: solid;

            opacity: 0.8;

            filter: drop-shadow(0 0 5px #008cff);
        }

        .corner.tl {
            top: 16px;
            left: 16px;
            border-width: 2px 0 0 2px;
        }

        .corner.tr {
            top: 16px;
            right: 16px;
            border-width: 2px 2px 0 0;
        }

        .corner.bl {
            bottom: 16px;
            left: 16px;
            border-width: 0 0 2px 2px;
        }

        .corner.br {
            bottom: 16px;
            right: 16px;
            border-width: 0 2px 2px 0;
        }

        /* ================================
           LOGO
        ================================= */

        .logo-container {
            width: 210px;
            height: 125px;

            margin: 0 auto 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            border-radius: 22px;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 184, 255, 0.15),
                    rgba(0, 20, 65, 0.40) 70%
                );

            border: 1px solid rgba(0, 190, 255, 0.25);

            box-shadow:
                inset 0 0 30px rgba(0, 150, 255, 0.10),
                0 0 25px rgba(0, 110, 255, 0.12);
        }

        .logo-container::before {
            content: "";

            position: absolute;
            inset: 7px;

            border: 1px solid rgba(0, 191, 255, 0.15);

            border-radius: 17px;

            animation: logoBorder 3s ease-in-out infinite;
        }

        @keyframes logoBorder {
            0%,
            100% {
                opacity: 0.35;
            }

            50% {
                opacity: 1;
            }
        }

        .logo {
            max-width: 175px;
            max-height: 100px;

            width: auto;
            height: auto;

            object-fit: contain;

            position: relative;
            z-index: 2;

            filter:
                drop-shadow(0 0 5px rgba(0, 195, 255, 0.65))
                drop-shadow(0 0 15px rgba(0, 130, 255, 0.45));

            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%,
            100% {
                filter:
                    drop-shadow(0 0 5px rgba(0, 195, 255, 0.55))
                    drop-shadow(0 0 12px rgba(0, 130, 255, 0.35));
            }

            50% {
                filter:
                    drop-shadow(0 0 8px rgba(0, 220, 255, 0.9))
                    drop-shadow(0 0 25px rgba(0, 130, 255, 0.65));
            }
        }

        /* ================================
           SISTEMA
        ================================= */

        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin-bottom: 9px;

            color: #00c8ff;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 3px;

            text-shadow:
                0 0 8px rgba(0, 195, 255, 0.65);
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #00eaff;

            box-shadow:
                0 0 7px #00eaff,
                0 0 18px #008cff,
                0 0 30px rgba(0, 210, 255, 0.8);

            animation: statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
        }

        /* ================================
           TITULO
        ================================= */

        h1 {
            text-align: center;

            font-size: 29px;
            font-weight: 800;

            color: #ffffff;

            margin-bottom: 8px;

            letter-spacing: -0.5px;

            text-shadow:
                0 0 12px rgba(0, 191, 255, 0.28);
        }

        .subtitle {
            text-align: center;

            color: #91b6d7;

            font-size: 13px;

            margin-bottom: 27px;
        }

        /* ================================
           SEGURIDAD
        ================================= */

        .security {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-bottom: 20px;

            color: #72a9d0;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.8px;
        }

        .security-icon {
            color: #00d9ff;

            font-size: 13px;

            text-shadow:
                0 0 10px #00bfff;
        }

        /* ================================
           CAMPOS
        ================================= */

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #9bc7e8;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            height: 54px;

            padding: 0 48px 0 17px;

            border-radius: 12px;

            border: 1px solid rgba(0, 165, 255, 0.24);

            outline: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 35, 85, 0.72),
                    rgba(0, 20, 58, 0.72)
                );

            color: #ffffff;

            font-size: 14px;

            transition: 0.3s ease;
        }

        .input-box input::placeholder {
            color: #5f83a3;
        }

        .input-box input:focus {
            border-color: #00c8ff;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 48, 110, 0.85),
                    rgba(0, 25, 70, 0.85)
                );

            box-shadow:
                0 0 0 2px rgba(0, 190, 255, 0.08),
                0 0 18px rgba(0, 166, 255, 0.22),
                inset 0 0 18px rgba(0, 120, 255, 0.08);
        }

        .input-icon {
            position: absolute;

            right: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: #5ca9d9;

            font-size: 17px;

            text-shadow:
                0 0 8px rgba(0, 174, 255, 0.45);
        }

        /* ================================
           BOTÓN NEÓN
        ================================= */

        .login-btn {
            width: 100%;
            height: 55px;

            position: relative;

            margin-top: 8px;

            border: 1px solid rgba(120, 235, 255, 0.5);

            border-radius: 13px;

            overflow: hidden;

            cursor: pointer;

            color: white;

            font-size: 12px;
            font-weight: 900;

            letter-spacing: 1.7px;

            background:
                linear-gradient(
                    100deg,
                    #005bea,
                    #008cff,
                    #00bfff,
                    #0070ef
                );

            background-size: 250% 100%;

            box-shadow:
                0 0 12px rgba(0, 170, 255, 0.45),
                0 0 28px rgba(0, 110, 255, 0.28),
                0 12px 30px rgba(0, 0, 30, 0.45);

            animation: buttonGradient 4s linear infinite;

            transition: 0.25s ease;
        }

        @keyframes buttonGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .login-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 65%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.65),
                    transparent
                );

            transform: skewX(-20deg);

            animation: buttonShine 2.8s infinite;
        }

        @keyframes buttonShine {
            0% {
                left: -100%;
            }

            45%,
            100% {
                left: 150%;
            }
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 18px rgba(0, 205, 255, 0.65),
                0 0 38px rgba(0, 110, 255, 0.42),
                0 16px 38px rgba(0, 0, 30, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ================================
           ERROR
        ================================= */

        .error {
            display: none;

            margin-top: 14px;

            padding: 11px;

            border-radius: 9px;

            text-align: center;

            color: #ff8d8d;

            background: rgba(120, 0, 20, 0.25);

            border: 1px solid rgba(255, 70, 90, 0.25);

            font-size: 11px;
            font-weight: 700;
        }

        .error.show {
            display: block;

            animation: errorShake 0.35s ease;
        }

        @keyframes errorShake {
            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        /* ================================
           FOOTER
        ================================= */

        .footer {
            margin-top: 25px;
            padding-top: 17px;

            text-align: center;

            border-top: 1px solid rgba(0, 174, 255, 0.12);
        }

        .footer strong {
            display: block;

            color: #d5efff;

            font-size: 10px;

            letter-spacing: 1.7px;

            margin-bottom: 4px;
        }

        .footer span {
            display: block;

            color: #6386a5;

            font-size: 9px;
        }

        .footer .system {
            margin-top: 9px;

            color: #00bfff;

            font-size: 8px;

            letter-spacing: 2px;

            font-weight: 800;

            text-shadow:
                0 0 8px rgba(0, 191, 255, 0.55);
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 600px) {

            .page {
                padding: 18px 14px;
            }

            .login-card {
                max-width: 100%;

                padding: 35px 23px 27px;

                border-radius: 22px;
            }

            .logo-container {
                width: 185px;
                height: 112px;
            }

            .logo {
                max-width: 155px;
                max-height: 88px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 12px;
            }

            .energy-one,
            .energy-two {
                opacity: 0.35;
            }
        }

        @media (max-height: 700px) {

            .page {
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .login-card {
                padding-top: 27px;
                padding-bottom: 22px;
            }

            .logo-container {
                height: 95px;
                margin-bottom: 16px;
            }

            .logo {
                max-height: 75px;
            }

            .subtitle {
                margin-bottom: 18px;
            }

            .security {
                margin-bottom: 14px;
            }

            .footer {
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Fondo tecnológico -->
    <div class="background-grid"></div>

    <div class="neon-orb orb-one"></div>
    <div class="neon-orb orb-two"></div>

    <div class="energy energy-one"></div>
    <div class="energy energy-two"></div>


    <main class="page">

        <section class="login-card">

            <div class="top-energy"></div>

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>


            <!-- LOGO DARSALUD -->
            <div class="logo-container">

                <img
                    src="Logo Oficial Darsalud Droguerías.png"
                    alt="Darsalud Droguerías"
                    class="logo"
                >

            </div>


            <!-- ESTADO DEL SISTEMA -->
            <div class="system-status">

                <span class="status-dot"></span>

                DARSALUD SYSTEM

            </div>


            <h1>
                Dashboard Gerencial
            </h1>


            <p class="subtitle">
                Plataforma de gestión y análisis empresarial
            </p>


            <!-- SEGURIDAD -->
            <div class="security">

                <span class="security-icon">
                    🔒
                </span>

                <span>
                    ACCESO SEGURO
                </span>

            </div>


            <!-- USUARIO -->
            <div class="input-group">

                <label for="usuario">
                    USUARIO
                </label>

                <div class="input-box">

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                    >

                    <span class="input-icon">
                        👤
                    </span>

                </div>

            </div>


            <!-- CONTRASEÑA -->
            <div class="input-group">

                <label for="password">
                    CONTRASEÑA
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                    >

                    <span
                        class="input-icon"
                        id="passwordIcon"
                        onclick="mostrarPassword()"
                        style="cursor:pointer; pointer-events:auto;"
                    >
                        👁
                    </span>

                </div>

            </div>


            <!-- BOTÓN -->
            <button
                class="login-btn"
                onclick="ingresar()"
            >
                INGRESAR AL DASHBOARD
            </button>


            <!-- ERROR -->
            <div
                class="error"
                id="error"
            >
                ⚠ Usuario o contraseña incorrectos
            </div>


            <!-- PIE -->
            <div class="footer">

                <strong>
                    DARSALUD DROGUERÍAS
                </strong>

                <span>
                    Más cerca de usted
                </span>

                <span class="system">
                    SISTEMA OPERATIVO · ACCESO AUTORIZADO
                </span>

            </div>

        </section>

    </main>


    <script>

        function ingresar() {

            const usuario =
                document.getElementById("usuario").value.trim();

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");


            /* CREDENCIALES */

            const usuarioCorrecto = "gerente";

            const passwordCorrecta = "Darsalud2026";


            if (
                usuario === usuarioCorrecto &&
                password === passwordCorrecta
            ) {

                error.classList.remove("show");

                window.location.href =
                    "Dashboard_Darsalud_Comparativo.html";

            } else {

                error.classList.add("show");

            }

        }


        function mostrarPassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");


            if (password.type === "password") {

                password.type = "text";

                icon.textContent = "🙈";

            } else {

                password.type = "password";

                icon.textContent = "👁";

            }

        }


        /* ENTER PARA INGRESAR */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    ingresar();

                }

            }
        );

    </script>

</body>
</html>
