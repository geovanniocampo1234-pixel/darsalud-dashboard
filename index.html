<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darsalud Droguerías | Dashboard Gerencial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================================================
   FONDO GENERAL
========================================================= */

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(0,120,255,.16),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(0,70,180,.15),
            transparent 40%
        ),

        linear-gradient(
            135deg,
            #f7fbff 0%,
            #eef5fc 50%,
            #f8fbff 100%
        );

    overflow-x:hidden;

    position:relative;
}

/* =========================================================
   RED TECNOLÓGICA DEL FONDO
========================================================= */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:

        linear-gradient(
            rgba(0,102,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,102,255,.035) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    pointer-events:none;
}

/* =========================================================
   DESTELLOS TECNOLÓGICOS
========================================================= */

body::after{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(0,119,255,.06);

    filter:blur(80px);

    top:-200px;
    right:-200px;

    pointer-events:none;
}

/* =========================================================
   TARJETA PRINCIPAL
========================================================= */

.login-card{

    position:relative;

    width:100%;
    max-width:470px;

    padding:42px 38px 34px;

    border-radius:28px;

    background:rgba(255,255,255,.96);

    border:1px solid rgba(0,105,255,.20);

    box-shadow:

        0 35px 80px rgba(0,65,140,.16),

        0 8px 25px rgba(0,90,200,.10),

        inset 0 1px 0 rgba(255,255,255,1);

    backdrop-filter:blur(15px);

    z-index:2;

    overflow:hidden;
}

/* línea superior tecnológica */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:8%;

    width:84%;
    height:3px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #008cff,
            #005eff,
            #00b7ff,
            transparent
        );

    box-shadow:

        0 0 10px #008cff,
        0 0 25px rgba(0,119,255,.65);

}

/* brillo interno */

.login-card::after{

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    border-radius:50%;

    background:rgba(0,119,255,.035);

    filter:blur(50px);

    right:-150px;
    bottom:-180px;

    pointer-events:none;
}

/* =========================================================
   MÓDULO 3D DEL LOGO
========================================================= */

.logo-module{

    position:relative;

    width:100%;

    min-height:145px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-bottom:28px;

    border-radius:22px;

    /*
       EL BLANCO DEL MÓDULO ES INTENCIONAL.
       EL JPG QUEDA DENTRO DE UNA PIEZA 3D.
    */

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #f1f7ff
        );

    border:1px solid rgba(0,105,255,.25);

    box-shadow:

        0 18px 35px rgba(0,75,160,.16),

        inset 0 2px 4px rgba(255,255,255,.95),

        inset 0 -5px 12px rgba(0,80,170,.08);

    overflow:hidden;

    transform:translateZ(0);
}

/* borde luminoso */

.logo-module::before{

    content:"";

    position:absolute;

    inset:5px;

    border-radius:18px;

    border:1px solid rgba(0,126,255,.18);

    box-shadow:

        inset 0 0 15px rgba(0,119,255,.07);

    pointer-events:none;
}

/* energía azul */

.logo-module::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(0,132,255,.18),
            transparent 70%
        );

    filter:blur(5px);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

/* =========================================================
   LOGO
========================================================= */

.logo{

    position:relative;

    z-index:2;

    width:270px;

    max-width:80%;

    height:auto;

    object-fit:contain;

    border-radius:12px;

    /*
       SOMBRA PARA QUE EL LOGO PAREZCA
       UNA PLACA TECNOLÓGICA ELEVADA
    */

    filter:

        drop-shadow(
            0 8px 10px rgba(0,50,120,.18)
        )

        drop-shadow(
            0 0 10px rgba(0,130,255,.12)
        );

    transition:.3s ease;
}

.logo-module:hover .logo{

    transform:

        translateY(-3px)

        scale(1.02);

    filter:

        drop-shadow(
            0 12px 15px rgba(0,50,120,.22)
        )

        drop-shadow(
            0 0 18px rgba(0,130,255,.22)
        );
}

/* =========================================================
   INDICADOR SUPERIOR
========================================================= */

.security-label{

    display:flex;

    justify-content:center;
    align-items:center;

    gap:8px;

    margin-bottom:10px;

    font-size:11px;

    font-weight:bold;

    letter-spacing:2px;

    color:#006cff;

    text-transform:uppercase;
}

.security-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#008cff;

    box-shadow:

        0 0 6px #008cff,
        0 0 14px #008cff;

    animation:pulse 1.8s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.75);
    }
}

/* =========================================================
   TITULOS
========================================================= */

h1{

    text-align:center;

    font-size:28px;

    font-weight:800;

    letter-spacing:.3px;

    color:#102b50;

    margin-bottom:8px;
}

.subtitle{

    text-align:center;

    color:#6c7d91;

    font-size:14px;

    margin-bottom:30px;

}

/* =========================================================
   CAMPOS
========================================================= */

.field{

    position:relative;

    margin-bottom:18px;
}

.field label{

    display:block;

    font-size:11px;

    font-weight:bold;

    color:#4c6682;

    margin-bottom:7px;

    letter-spacing:.8px;

    text-transform:uppercase;
}

.field input{

    width:100%;

    height:55px;

    padding:0 17px;

    border-radius:14px;

    border:1px solid rgba(0,106,255,.20);

    outline:none;

    background:

        linear-gradient(
            145deg,
            #f7fbff,
            #edf5fd
        );

    color:#163250;

    font-size:15px;

    box-shadow:

        inset 0 2px 5px rgba(0,60,130,.04),

        0 4px 12px rgba(0,70,150,.06);

    transition:.25s ease;
}

.field input::placeholder{

    color:#9aabba;
}

.field input:focus{

    border-color:#0085ff;

    background:#ffffff;

    box-shadow:

        0 0 0 3px rgba(0,119,255,.09),

        0 7px 20px rgba(0,100,220,.10),

        inset 0 1px 2px rgba(255,255,255,1);
}

/* =========================================================
   PASSWORD
========================================================= */

.password-wrapper{

    position:relative;
}

.password-wrapper input{

    padding-right:55px;
}

.show-password{

    position:absolute;

    right:16px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#1976d2;

    font-size:18px;

    user-select:none;

    transition:.2s;
}

.show-password:hover{

    color:#004dff;

    transform:
        translateY(-50%)
        scale(1.1);
}

/* =========================================================
   BOTÓN FUTURISTA
========================================================= */

.login-button{

    position:relative;

    width:100%;

    height:58px;

    margin-top:8px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    color:white;

    font-size:13px;

    font-weight:800;

    letter-spacing:1.5px;

    background:

        linear-gradient(
            135deg,
            #0068ff,
            #008fff,
            #0053df
        );

    box-shadow:

        0 12px 25px rgba(0,91,220,.25),

        inset 0 1px 0 rgba(255,255,255,.35),

        inset 0 -3px 6px rgba(0,40,130,.25);

    overflow:hidden;

    transition:.25s ease;
}

.login-button::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:

        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:skewX(-20deg);

    transition:.6s;
}

.login-button:hover::before{

    left:130%;
}

.login-button:hover{

    transform:translateY(-2px);

    box-shadow:

        0 16px 32px rgba(0,91,220,.32),

        0 0 18px rgba(0,132,255,.22),

        inset 0 1px 0 rgba(255,255,255,.4);
}

.login-button:active{

    transform:translateY(1px);

    box-shadow:

        0 6px 12px rgba(0,91,220,.22);
}

/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-top:17px;

    padding:12px 15px;

    border-radius:11px;

    text-align:center;

    font-size:13px;

    font-weight:bold;

    color:#c62828;

    background:#fff4f4;

    border:1px solid rgba(198,40,40,.15);
}

/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:28px;

    padding-top:20px;

    border-top:1px solid rgba(0,80,160,.10);

    text-align:center;

    color:#8393a5;

    font-size:10px;

    line-height:1.8;

    letter-spacing:.7px;
}

.footer strong{

    color:#1665b5;

    font-size:11px;
}

/* =========================================================
   DETALLES TECNOLÓGICOS
========================================================= */

.tech-corner{

    position:absolute;

    width:35px;
    height:35px;

    border-color:rgba(0,116,255,.25);

    pointer-events:none;
}

.tech-corner.top-left{

    top:18px;
    left:18px;

    border-top:2px solid;
    border-left:2px solid;

    border-radius:8px 0 0 0;
}

.tech-corner.top-right{

    top:18px;
    right:18px;

    border-top:2px solid;
    border-right:2px solid;

    border-radius:0 8px 0 0;
}

.tech-corner.bottom-left{

    bottom:18px;
    left:18px;

    border-bottom:2px solid;
    border-left:2px solid;

    border-radius:0 0 0 8px;
}

.tech-corner.bottom-right{

    bottom:18px;
    right:18px;

    border-bottom:2px solid;
    border-right:2px solid;

    border-radius:0 0 8px 0;
}

/* =========================================================
   RESPONSIVE CELULAR
========================================================= */

@media(max-width:600px){

    body{

        padding:16px;

        align-items:center;
    }

    .login-card{

        max-width:100%;

        padding:30px 22px 25px;

        border-radius:23px;
    }

    .logo-module{

        min-height:125px;

        margin-bottom:23px;

        border-radius:19px;
    }

    .logo{

        width:235px;
    }

    h1{

        font-size:24px;
    }

    .subtitle{

        font-size:13px;

        margin-bottom:25px;
    }

    .field input{

        height:53px;
    }

    .login-button{

        height:56px;
    }

}

/* =========================================================
   CELULARES MUY PEQUEÑOS
========================================================= */

@media(max-width:380px){

    .login-card{

        padding:25px 18px 22px;
    }

    .logo-module{

        min-height:110px;
    }

    .logo{

        width:205px;
    }

    h1{

        font-size:22px;
    }
}

</style>
</head>


<body>


<div class="login-card">

    <!-- ESQUINAS TECNOLÓGICAS -->

    <span class="tech-corner top-left"></span>
    <span class="tech-corner top-right"></span>
    <span class="tech-corner bottom-left"></span>
    <span class="tech-corner bottom-right"></span>


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo-module">

        <img
            src="Logo Darsalud Droguerías .jpg"
            alt="Darsalud Droguerías"
            class="logo"
        >

    </div>


    <!-- =====================================================
         SEGURIDAD
    ====================================================== -->

    <div class="security-label">

        <span class="security-dot"></span>

        ACCESO SEGURO

    </div>


    <!-- =====================================================
         TITULO
    ====================================================== -->

    <h1>
        Dashboard Gerencial
    </h1>

    <div class="subtitle">
        Plataforma de gestión y análisis empresarial
    </div>


    <!-- =====================================================
         USUARIO
    ====================================================== -->

    <div class="field">

        <label>
            Usuario
        </label>

        <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
        >

    </div>


    <!-- =====================================================
         CONTRASEÑA
    ====================================================== -->

    <div class="field">

        <label>
            Contraseña
        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password"
            >

            <span
                class="show-password"
                onclick="mostrarPassword()"
                title="Mostrar contraseña"
            >
                👁
            </span>

        </div>

    </div>


    <!-- =====================================================
         BOTÓN
    ====================================================== -->

    <button
        class="login-button"
        onclick="ingresar()"
    >

        INGRESAR AL DASHBOARD

    </button>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        class="error"
        id="error"
    >

        ⚠ Usuario o contraseña incorrectos

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        <strong>
            DARSALUD DROGUERÍAS
        </strong>

        <br>

        Más cerca de usted

        <br>

        Plataforma gerencial · Acceso autorizado

    </div>

</div>


<script>

/* =========================================================
   CREDENCIALES
========================================================= */

const USUARIO_CORRECTO = "gerente";

const PASSWORD_CORRECTA = "Darsalud2026";


/* =========================================================
   INGRESAR
========================================================= */

function ingresar(){

    const usuario =
        document.getElementById("usuario").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if(
        usuario === USUARIO_CORRECTO &&
        password === PASSWORD_CORRECTA
    ){

        error.style.display = "none";

        window.location.href =
            "Dashboard_Darsalud_Comparativo.html";

    }else{

        error.style.display = "block";

    }

}


/* =========================================================
   MOSTRAR / OCULTAR CONTRASEÑA
========================================================= */

function mostrarPassword(){

    const password =
        document.getElementById("password");

    const icon =
        document.querySelector(".show-password");


    if(password.type === "password"){

        password.type = "text";

        icon.textContent = "🙈";

    }else{

        password.type = "password";

        icon.textContent = "👁";

    }

}


/* =========================================================
   ENTER PARA INGRESAR
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            ingresar();

        }

    }
);

</script>

</body>
</html>
