```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Darsalud Droguerías | APP Gerencial</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #004b87 0%,
        #006eb6 50%,
        #003b6b 100%
      );

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      padding: 42px 40px 36px;
      border-radius: 22px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.28);

      text-align: center;
    }

    /* =========================
       LOGO DARSALUD DROGUERÍAS
       ========================= */

    .logo {
      margin-bottom: 30px;
    }

    .logo-darsalud {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0057a8;
      line-height: 1;
    }

    .logo-droguerias {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #0057a8;
      text-transform: uppercase;
    }

    .logo-line {
      width: 70px;
      height: 4px;
      margin: 12px auto 0;

      background: #0057a8;

      border-radius: 5px;
    }

    /* =========================
       TÍTULO
       ========================= */

    h1 {
      font-size: 25px;
      color: #222222;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #777777;
      margin-bottom: 30px;
    }

    /* =========================
       CAMPOS
       ========================= */

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #444444;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 18px;
    }

    input {
      width: 100%;

      padding: 14px 14px 14px 45px;

      border: 1px solid #d2d2d2;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #006eb6;

      box-shadow:
        0 0 0 3px rgba(0,110,182,0.13);
    }

    /* =========================
       BOTÓN
       ========================= */

    button {
      width: 100%;

      padding: 15px;

      margin-top: 5px;

      border: none;

      border-radius: 10px;

      background: #0057a8;

      color: #ffffff;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      background: #003f7d;

      transform: translateY(-1px);

      box-shadow:
        0 6px 15px rgba(0,0,0,0.18);
    }

    /* =========================
       ERROR
       ========================= */

    .error {
      display: none;

      margin-top: 16px;

      padding: 10px;

      border-radius: 8px;

      background: #fff0f0;

      color: #c40000;

      font-size: 14px;

      font-weight: bold;
    }

    /* =========================
       PIE
       ========================= */

    .footer {
      margin-top: 28px;

      font-size: 12px;

      line-height: 1.6;

      color: #888888;
    }

    .footer strong {
      color: #0057a8;
    }

    /* =========================
       CELULARES
       ========================= */

    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .login-card {
        padding: 35px 25px 30px;
        border-radius: 18px;
      }

      .logo-darsalud {
        font-size: 31px;
      }

      .logo-droguerias {
        font-size: 14px;
        letter-spacing: 4px;
      }

      h1 {
        font-size: 22px;
      }

    }

  </style>

</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <!-- LOGO -->

      <div class="logo">

        <div class="logo-darsalud">
          DARSALUD
        </div>

        <div class="logo-droguerias">
          DROGUERÍAS
        </div>

        <div class="logo-line"></div>

      </div>


      <!-- TÍTULO -->

      <h1>
        APP Darsalud
      </h1>

      <div class="subtitle">
        Dashboard Gerencial
      </div>


      <!-- USUARIO -->

      <div class="input-group">

        <label for="usuario">
          Usuario
        </label>

        <div class="input-wrapper">

          <span class="input-icon">
            👤
          </span>

          <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
          >

        </div>

      </div>


      <!-- CONTRASEÑA -->

      <div class="input-group">

        <label for="password">
          Contraseña
        </label>

        <div class="input-wrapper">

          <span class="input-icon">
            🔐
          </span>

          <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          >

        </div>

      </div>


      <!-- BOTÓN -->

      <button onclick="ingresar()">
        INGRESAR AL DASHBOARD
      </button>


      <!-- ERROR -->

      <div id="error" class="error">
        Usuario o contraseña incorrectos
      </div>


      <!-- PIE -->

      <div class="footer">

        <strong>DARSALUD DROGUERÍAS</strong>

        <br>

        Más cerca de usted

      </div>

    </div>

  </div>


  <script>

    function ingresar() {

      const usuario =
        document.getElementById("usuario").value.trim();

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      /*
        ACCESO TEMPORAL PARA PRUEBAS

        Usuario: gerente
        Contraseña: Darsalud2026
      */


      if (
        usuario === "gerente" &&
        password === "Darsalud2026"
      ) {

        window.location.href =
          "Dashboard_Darsalud_Comparativo.html";

      } else {

        error.style.display = "block";

      }

    }


    /* ENTER PARA INGRESAR */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          ingresar();

        }

      }
    );

  </script>

</body>
</html>
```
