```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darsalud Droguerías | Dashboard Gerencial</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 35%, rgba(0, 153, 255, 0.12), transparent 35%),
                radial-gradient(circle at 15% 80%, rgba(0, 102, 255, 0.10), transparent 30%),
                #f4f8fc;
            position: relative;
        }

        /* Fondo tecnológico */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 110, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 110, 255, 0.035) 1px, transparent 1px);
            background-size: 45px 45px;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(45px, 45px);
            }
        }

        /* Luz ambiental */
        .ambient-light {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(0, 132, 255, 0.08);
            filter: blur(80px);
            animation: ambient 7s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes ambient {
            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.1);
                opacity: 0.9;
            }
        }

        /* Contenedor principal */
        .login-wrapper {
            width: 100%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        /* Tarjeta */
        .login-card {
            position: relative;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 110, 255, 0.15);
            border-radius: 28px;
            padding: 42px 40px 32px;
            box-shadow:
                0 30px 80px rgba(0, 60, 120, 0.16),
                0 0 50px rgba(0, 119, 255, 0.08);
            overflow: hidden;
        }

        /* Línea superior de energía */
        .energy-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 4px;
            background: linear-gradient(
                90deg,
                transparent,
                #007bff,
                #00aaff,
                #007bff,
                transparent
            );
            box-shadow:
                0 0 12px #008cff,
                0 0 25px rgba(0, 140, 255, 0.7);
            animation: energyMove 3s linear infinite;
        }

        @keyframes energyMove {
            0% {
                transform: translateX(-20%);
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateX(20%);
                opacity: 0.4;
            }
        }

        /* Línea de escaneo */
        .scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0, 145, 255, 0.22);
            box-shadow: 0 0 12px rgba(0, 145, 255, 0.5);
            animation: scan 5s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -5%;
            }

            100% {
                top: 105%;
            }
        }

        /* Marcadores tecnológicos */
        .corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: rgba(0, 119, 255, 0.55);
            border-style: solid;
        }

        .corner.tl {
            top: 18px;
            left: 18px;
            border-width: 2px 0 0 2px;
        }

        .corner.tr {
            top: 18px;
            right: 18px;
            border-width: 2px 2px 0 0;
        }

        .corner.bl {
            bottom: 18px;
            left: 18px;
            border-width: 0 0 2px 2px;
        }

        .corner.br {
            bottom: 18px;
            right: 18px;
            border-width: 0 2px 2px 0;
        }

        /* Módulo del logo */
        .logo-module {
            width: 190px;
            height: 115px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.98),
                    rgba(237,246,255,0.96)
                );
            border: 1px solid rgba(0, 119, 255, 0.16);
            box-shadow:
                inset 0 0 25px rgba(0, 119, 255, 0.06),
                0 12px 30px rgba(0, 80, 160, 0.10);
        }

        .logo-module::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(0, 119, 255, 0.08);
            border-radius: 15px;
            pointer-events: none;
        }

        .logo {
            max-width: 160px;
            max-height: 90px;
            width: auto;
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter:
                drop-shadow(0 0 5px rgba(0, 110, 255, 0.20))
                drop-shadow(0 4px 8px rgba(0, 80, 150, 0.15));
        }

        /* Estado del sistema */
        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #0074d9;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #008cff;
            box-shadow:
                0 0 7px #008cff,
                0 0 14px rgba(0, 140, 255, 0.6);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: 0.55;
            }
        }

        h1 {
            text-align: center;
            color: #10243e;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #6a7b90;
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* Indicador de seguridad */
        .security {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 20px;
            color: #60758c;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .security-icon {
            color: #007bff;
            font-size: 13px;
        }

        /* Campos */
        .input-group {
            position: relative;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #314760;
            font-size: 12px;
            font-weight: 700;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            height: 52px;
            padding: 0 45px 0 17px;
            border: 1px solid #d7e2ee;
            border-radius: 12px;
            background: rgba(247, 250, 253, 0.95);
            color: #1e3148;
            outline: none;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .input-box input::placeholder {
            color: #9aa9b9;
        }

        .input-box input:focus {
            border-color: #008cff;
            background: #ffffff;
            box-shadow:
                0 0 0 3px rgba(0, 140, 255, 0.08),
                0 0 20px rgba(0, 140, 255, 0.10);
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #7890a8;
            font-size: 17px;
            pointer-events: none;
        }

        /* Botón */
        .login-btn {
            position: relative;
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(
                100deg,
                #005bea,
                #008cff,
                #0066e8
            );
            color: white;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.2px;
            cursor: pointer;
            overflow: hidden;
            box-shadow:
                0 12px 28px rgba(0, 105, 230, 0.25),
                0 0 20px rgba(0, 140, 255, 0.12);
            transition: 0.25s ease;
        }

        .login-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.45),
                transparent
            );
            transform: skewX(-20deg);
            animation: buttonShine 3.2s infinite;
        }

        @keyframes buttonShine {
            0% {
                left: -100%;
            }

            45%, 100% {
                left: 150%;
            }
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 15px 34px rgba(0, 105, 230, 0.32),
                0 0 25px rgba(0, 140, 255, 0.20);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Error */
        .error {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 9px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #c62828;
            background: rgba(255, 235, 235, 0.95);
            border: 1px solid rgba(220, 60, 60, 0.20);
        }

        .error.show {
            display: block;
            animation: errorShake 0.35s ease;
        }

        @keyframes errorShake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 100, 200, 0.08);
        }

        .footer strong {
            display: block;
            color: #25415f;
            font-size: 11px;
            letter-spacing: 1.4px;
            margin-bottom: 4px;
        }

        .footer span {
            display: block;
            color: #8394a7;
            font-size: 10px;
        }

        .footer .system {
            margin-top: 9px;
            color: #0080e8;
            font-size: 9px;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .login-wrapper {
                padding: 16px;
            }

            .login-card {
                padding: 35px 24px 27px;
                border-radius: 22px;
            }

            .logo-module {
                width: 175px;
                height: 105px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-light"></div>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="energy-line"></div>
            <div class="scan-line"></div>

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="logo-module">
                <img
                    src="Logo Oficial Darsalud Droguerías.png"
                    alt="Darsalud Droguerías"
                    class="logo"
                >
            </div>

            <div class="system-status">
                <span class="status-dot"></span>
                DARSALUD SYSTEM
            </div>

            <h1>Dashboard Gerencial</h1>

            <p class="subtitle">
                Plataforma de gestión y análisis empresarial
            </p>

            <div class="security">
                <span class="security-icon">🔒</span>
                <span>ACCESO SEGURO</span>
            </div>

            <div class="input-group">
                <label for="usuario">USUARIO</label>

                <div class="input-box">
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                    >
                    <span class="input-icon">👤</span>
                </div>
            </div>

            <div class="input-group">
                <label for="password">CONTRASEÑA</label>

                <div class="input-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                    >

                    <span
                        class="input-icon"
                        id="passwordIcon"
                        onclick="mostrarPassword()"
                        style="pointer-events:auto; cursor:pointer;"
                    >
                        👁
                    </span>
                </div>
            </div>

            <button class="login-btn" onclick="ingresar()">
                INGRESAR AL DASHBOARD
            </button>

            <div class="error" id="error">
                ⚠ Usuario o contraseña incorrectos
            </div>

            <div class="footer">
                <strong>DARSALUD DROGUERÍAS</strong>
                <span>Más cerca de usted</span>
                <span class="system">
                    SISTEMA OPERATIVO · ACCESO AUTORIZADO
                </span>
            </div>

        </div>

    </div>

    <script>

        function ingresar() {

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");

            /*
             * CREDENCIALES ACTUALES
             */
            const usuarioCorrecto = "gerente";
            const passwordCorrecta = "Darsalud2026";

            if (
                usuario === usuarioCorrecto &&
                password === passwordCorrecta
            ) {

                error.classList.remove("show");

                window.location.href =
                    "Dashboard_Darsalud_Comparativo.html";

            } else {

                error.classList.add("show");

            }
        }


        function mostrarPassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");

            if (password.type === "password") {

                password.type = "text";
                icon.textContent = "🙈";

            } else {

                password.type = "password";
                icon.textContent = "👁";

            }
        }


        /*
         * Permitir ingresar presionando ENTER
         */
        document.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                ingresar();
            }

        });

    </script>

</body>
</html>
