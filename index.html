<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Darsalud Droguerías | Dashboard Gerencial</title>


<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#17304f;

    overflow-x:hidden;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(0,126,255,.14),
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(0,91,220,.13),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #f7fbff,
            #eaf3fc,
            #f9fcff
        );

    position:relative;
}


/* =========================================================
   RED DIGITAL DE FONDO
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:

        linear-gradient(
            rgba(0,105,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,105,255,.035) 1px,
            transparent 1px
        );

    background-size:
        45px 45px;

    pointer-events:none;

    animation:
        gridMove 18s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:45px 45px;
    }

}


/* =========================================================
   LUCES AMBIENTALES
========================================================= */

body::after{

    content:"";

    position:fixed;

    width:520px;
    height:520px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,136,255,.10),
            transparent 68%
        );

    filter:blur(40px);

    top:-250px;
    right:-200px;

    pointer-events:none;

    animation:
        ambientLight 7s ease-in-out infinite alternate;
}

@keyframes ambientLight{

    from{
        opacity:.55;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1.15);
    }

}


/* =========================================================
   TARJETA PRINCIPAL
========================================================= */

.login-card{

    position:relative;

    width:100%;

    max-width:480px;

    padding:
        42px
        38px
        32px;

    border-radius:30px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid rgba(0,105,255,.20);

    box-shadow:

        0 35px 80px
        rgba(0,55,120,.17),

        0 10px 30px
        rgba(0,91,200,.09),

        inset 0 1px 0
        rgba(255,255,255,1);

    backdrop-filter:
        blur(20px);

    overflow:hidden;

    z-index:5;

    animation:
        cardAppear .8s ease;
}

@keyframes cardAppear{

    from{

        opacity:0;

        transform:
            translateY(20px)
            scale(.97);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   BORDE TECNOLÓGICO SUPERIOR
========================================================= */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:7%;

    width:86%;

    height:3px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #006cff,
            #00b9ff,
            #006cff,
            transparent
        );

    box-shadow:

        0 0 8px #008cff,

        0 0 22px
        rgba(0,132,255,.65);

    animation:
        topEnergy 3s ease-in-out infinite;
}

@keyframes topEnergy{

    0%,
    100%{
        opacity:.55;
    }

    50%{
        opacity:1;
    }

}


/* =========================================================
   ESCANEO DE LA TARJETA
========================================================= */

.scan-line{

    position:absolute;

    left:0;

    width:100%;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,137,255,.05),
            rgba(0,137,255,.55),
            rgba(0,137,255,.05),
            transparent
        );

    box-shadow:

        0 0 8px
        rgba(0,132,255,.45);

    opacity:.45;

    animation:
        scanning 5s linear infinite;

    pointer-events:none;

    z-index:10;
}

@keyframes scanning{

    0%{
        top:-5%;
    }

    100%{
        top:105%;
    }

}


/* =========================================================
   ESQUINAS TECNOLÓGICAS
========================================================= */

.corner{

    position:absolute;

    width:42px;
    height:42px;

    border-color:
        rgba(0,115,255,.30);

    pointer-events:none;

    z-index:8;
}

.corner.tl{

    top:16px;
    left:16px;

    border-top:2px solid;
    border-left:2px solid;

    border-radius:
        9px 0 0 0;
}

.corner.tr{

    top:16px;
    right:16px;

    border-top:2px solid;
    border-right:2px solid;

    border-radius:
        0 9px 0 0;
}

.corner.bl{

    bottom:16px;
    left:16px;

    border-bottom:2px solid;
    border-left:2px solid;

    border-radius:
        0 0 0 9px;
}

.corner.br{

    bottom:16px;
    right:16px;

    border-bottom:2px solid;
    border-right:2px solid;

    border-radius:
        0 0 9px 0;
}


/* =========================================================
   MÓDULO DEL LOGO
========================================================= */

.logo-module{

    position:relative;

    width:100%;

    min-height:155px;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:27px;

    border-radius:23px;

    background:

        linear-gradient(
            145deg,
            #ffffff 0%,
            #f7fbff 48%,
            #eaf4ff 100%
        );

    border:
        1px solid
        rgba(0,108,255,.28);

    box-shadow:

        0 18px 38px
        rgba(0,65,145,.17),

        inset 0 2px 4px
        rgba(255,255,255,1),

        inset 0 -7px 15px
        rgba(0,75,160,.08);

    overflow:hidden;

    transform:
        perspective(900px);
}


/* brillo alrededor del módulo */

.logo-module::before{

    content:"";

    position:absolute;

    inset:5px;

    border-radius:19px;

    border:
        1px solid
        rgba(0,127,255,.18);

    box-shadow:

        inset 0 0 22px
        rgba(0,125,255,.07);

    pointer-events:none;
}


/* energía azul detrás del logo */

.logo-module::after{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(0,137,255,.18),
            rgba(0,137,255,.05) 35%,
            transparent 70%
        );

    filter:blur(7px);

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    animation:
        logoEnergy 4s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes logoEnergy{

    from{
        transform:
            translate(-50%,-50%)
            scale(.82);

        opacity:.55;
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.12);

        opacity:1;
    }

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    position:relative;

    z-index:3;

    width:275px;

    max-width:80%;

    height:auto;

    object-fit:contain;

    border-radius:12px;

    filter:

        drop-shadow(
            0 9px 10px
            rgba(0,45,110,.18)
        )

        drop-shadow(
            0 0 13px
            rgba(0,130,255,.16)
        );

    transition:
        transform .4s ease,
        filter .4s ease;
}

.logo-module:hover .logo{

    transform:
        translateY(-3px)
        scale(1.025);

    filter:

        drop-shadow(
            0 13px 17px
            rgba(0,45,110,.23)
        )

        drop-shadow(
            0 0 22px
            rgba(0,130,255,.28)
        );
}


/* =========================================================
   MICRO INDICADORES DEL MÓDULO
========================================================= */

.module-status{

    position:absolute;

    left:14px;
    bottom:11px;

    display:flex;

    align-items:center;

    gap:6px;

    font-size:8px;

    font-weight:bold;

    letter-spacing:1.2px;

    color:#4880b8;

    z-index:4;
}

.status-light{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#00a2ff;

    box-shadow:
        0 0 6px #008cff;

    animation:
        statusPulse 1.6s infinite;
}

@keyframes statusPulse{

    0%,
    100%{
        opacity:1;
    }

    50%{
        opacity:.3;
    }

}


/* =========================================================
   INDICADOR SEGURIDAD
========================================================= */

.security-label{

    display:flex;

    justify-content:center;
    align-items:center;

    gap:8px;

    margin-bottom:9px;

    color:#0070db;

    font-size:10px;

    font-weight:800;

    letter-spacing:2px;

    text-transform:uppercase;
}

.security-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#009cff;

    box-shadow:

        0 0 6px #008cff,

        0 0 14px
        rgba(0,132,255,.8);

    animation:
        securityPulse 1.8s infinite;
}

@keyframes securityPulse{

    0%,
    100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(.65);
        opacity:.45;
    }

}


/* =========================================================
   TITULO
========================================================= */

h1{

    text-align:center;

    color:#102b4c;

    font-size:28px;

    font-weight:800;

    letter-spacing:.2px;

    margin-bottom:7px;
}

.subtitle{

    text-align:center;

    color:#71849a;

    font-size:13px;

    margin-bottom:28px;
}


/* =========================================================
   CAMPOS
========================================================= */

.field{

    position:relative;

    margin-bottom:18px;
}

.field label{

    display:block;

    margin-bottom:7px;

    color:#4d6681;

    font-size:10px;

    font-weight:800;

    letter-spacing:1.1px;

    text-transform:uppercase;
}


/* =========================================================
   INPUT TECNOLÓGICO
========================================================= */

.field input{

    width:100%;

    height:56px;

    padding:
        0 17px;

    border-radius:15px;

    border:
        1px solid
        rgba(0,105,255,.20);

    outline:none;

    background:

        linear-gradient(
            145deg,
            #f8fbff,
            #edf5fd
        );

    color:#173553;

    font-size:14px;

    box-shadow:

        inset 0 2px 5px
        rgba(0,55,120,.045),

        0 5px 14px
        rgba(0,70,150,.055);

    transition:
        .3s ease;
}

.field input::placeholder{

    color:#9aacbd;
}


/* campo enfocado */

.field input:focus{

    background:#ffffff;

    border-color:#0088ff;

    box-shadow:

        0 0 0 3px
        rgba(0,126,255,.075),

        0 0 18px
        rgba(0,126,255,.12),

        0 8px 22px
        rgba(0,70,150,.10),

        inset 0 1px 2px
        rgba(255,255,255,1);
}


/* línea energética debajo */

.field::after{

    content:"";

    position:absolute;

    left:8%;

    bottom:-1px;

    width:84%;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #008cff,
            transparent
        );

    opacity:0;

    transition:.3s ease;
}

.field:focus-within::after{

    opacity:.65;

    box-shadow:
        0 0 8px #008cff;
}


/* =========================================================
   PASSWORD
========================================================= */

.password-wrapper{

    position:relative;
}

.password-wrapper input{

    padding-right:52px;
}

.show-password{

    position:absolute;

    right:16px;
    top:50%;

    transform:
        translateY(-50%);

    color:#1775c9;

    cursor:pointer;

    font-size:17px;

    user-select:none;

    transition:.25s ease;
}

.show-password:hover{

    color:#005cff;

    transform:
        translateY(-50%)
        scale(1.1);
}


/* =========================================================
   BOTÓN
========================================================= */

.login-button{

    position:relative;

    width:100%;

    height:59px;

    margin-top:7px;

    border:none;

    border-radius:16px;

    cursor:pointer;

    overflow:hidden;

    color:#ffffff;

    font-size:12px;

    font-weight:800;

    letter-spacing:1.5px;

    background:

        linear-gradient(
            135deg,
            #005eff,
            #008fff,
            #0061e8
        );

    box-shadow:

        0 13px 27px
        rgba(0,82,210,.27),

        0 0 18px
        rgba(0,132,255,.12),

        inset 0 1px 0
        rgba(255,255,255,.38),

        inset 0 -4px 7px
        rgba(0,40,130,.22);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/* brillo móvil */

.login-button::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:65%;
    height:100%;

    background:

        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.50),
            transparent
        );

    transform:
        skewX(-22deg);

    animation:
        buttonScan 4s ease-in-out infinite;
}

@keyframes buttonScan{

    0%{
        left:-120%;
    }

    45%{
        left:140%;
    }

    100%{
        left:140%;
    }

}


.login-button:hover{

    transform:
        translateY(-2px);

    box-shadow:

        0 17px 35px
        rgba(0,82,210,.32),

        0 0 25px
        rgba(0,132,255,.23),

        inset 0 1px 0
        rgba(255,255,255,.45),

        inset 0 -4px 7px
        rgba(0,40,130,.22);
}

.login-button:active{

    transform:
        translateY(1px);

}


/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-top:16px;

    padding:12px;

    border-radius:12px;

    text-align:center;

    color:#c62828;

    font-size:12px;

    font-weight:bold;

    background:#fff5f5;

    border:
        1px solid
        rgba(198,40,40,.16);

    animation:
        errorAppear .25s ease;
}

@keyframes errorAppear{

    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:27px;

    padding-top:19px;

    border-top:
        1px solid
        rgba(0,80,160,.10);

    text-align:center;

    color:#8595a6;

    font-size:9px;

    line-height:1.9;

    letter-spacing:.7px;
}

.footer strong{

    color:#1267b7;

    font-size:10px;

}


/* =========================================================
   ESTADO DEL SISTEMA
========================================================= */

.system-status{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    margin-top:9px;

    font-size:8px;

    color:#7b91a8;

    letter-spacing:1px;

    text-transform:uppercase;
}

.system-status span{

    width:5px;
    height:5px;

    border-radius:50%;

    background:#00a2ff;

    box-shadow:
        0 0 6px #008cff;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    body{

        padding:15px;
    }

    .login-card{

        max-width:100%;

        padding:
            30px
            21px
            25px;

        border-radius:24px;
    }

    .logo-module{

        min-height:130px;

        margin-bottom:23px;

        border-radius:20px;
    }

    .logo{

        width:235px;
    }

    h1{

        font-size:24px;
    }

    .subtitle{

        font-size:12px;

        margin-bottom:24px;
    }

    .field input{

        height:54px;
    }

    .login-button{

        height:57px;
    }

}


/* =========================================================
   CELULARES PEQUEÑOS
========================================================= */

@media(max-width:380px){

    body{

        padding:10px;
    }

    .login-card{

        padding:
            25px
            17px
            22px;
    }

    .logo-module{

        min-height:112px;
    }

    .logo{

        width:205px;
    }

    h1{

        font-size:22px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     TARJETA LOGIN
======================================================= -->

<div class="login-card">


    <!-- ESCÁNER -->

    <div class="scan-line"></div>


    <!-- ESQUINAS -->

    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>


    <!-- ===================================================
         LOGO
    ==================================================== -->

    <div class="logo-module">

        <img
            src="Logo Darsalud Droguerías .jpg"
            alt="Darsalud Droguerías"
            class="logo"
        >

        <div class="module-status">

            <span class="status-light"></span>

            DARSALUD SYSTEM

        </div>

    </div>


    <!-- ===================================================
         SEGURIDAD
    ==================================================== -->

    <div class="security-label">

        <span class="security-dot"></span>

        ACCESO SEGURO

    </div>


    <!-- ===================================================
         TITULO
    ==================================================== -->

    <h1>
        Dashboard Gerencial
    </h1>


    <div class="subtitle">
        Plataforma de gestión y análisis empresarial
    </div>


    <!-- ===================================================
         USUARIO
    ==================================================== -->

    <div class="field">

        <label>
            Usuario
        </label>

        <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
        >

    </div>


    <!-- ===================================================
         CONTRASEÑA
    ==================================================== -->

    <div class="field">

        <label>
            Contraseña
        </label>


        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password"
            >


            <span
                class="show-password"
                onclick="mostrarPassword()"
                title="Mostrar contraseña"
            >
                👁
            </span>

        </div>

    </div>


    <!-- ===================================================
         BOTÓN
    ==================================================== -->

    <button
        class="login-button"
        onclick="ingresar()"
    >

        INGRESAR AL DASHBOARD

    </button>


    <!-- ===================================================
         ERROR
    ==================================================== -->

    <div
        class="error"
        id="error"
    >

        ⚠ Usuario o contraseña incorrectos

    </div>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <div class="footer">

        <strong>
            DARSALUD DROGUERÍAS
        </strong>

        <br>

        Más cerca de usted

        <br>

        Plataforma gerencial · Acceso autorizado


        <div class="system-status">

            <span></span>

            SISTEMA OPERATIVO

        </div>

    </div>


</div>


<script>

/* =========================================================
   CREDENCIALES ACTUALES
========================================================= */

const USUARIO_CORRECTO = "gerente";

const PASSWORD_CORRECTA = "Darsalud2026";


/* =========================================================
   FUNCIÓN INGRESAR
========================================================= */

function ingresar(){

    const usuario =
        document
        .getElementById("usuario")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("error");


    if(
        usuario === USUARIO_CORRECTO &&
        password === PASSWORD_CORRECTA
    ){

        error.style.display = "none";


        /*
           ACCESO AL DASHBOARD
        */

        window.location.href =
            "Dashboard_Darsalud_Comparativo.html";


    }else{

        error.style.display =
            "block";

    }

}


/* =========================================================
   MOSTRAR / OCULTAR CONTRASEÑA
========================================================= */

function mostrarPassword(){

    const password =
        document
        .getElementById("password");

    const icon =
        document
        .querySelector(".show-password");


    if(
        password.type === "password"
    ){

        password.type = "text";

        icon.textContent = "🙈";

    }else{

        password.type = "password";

        icon.textContent = "👁";

    }

}


/* =========================================================
   ENTER PARA INGRESAR
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            ingresar();

        }

    }
);

</script>


</body>
</html>
